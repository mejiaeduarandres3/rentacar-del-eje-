[build]
  publish = "."

[[edge_functions]]
  function = "track-visit"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://www.rentacardeleje.com/*"
  to = "https://rentacardeleje.com/:splat"
  status = 301
  force = true

# Pretty URLs: strip .html extension
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/todos.html"
  to = "/todos"
  status = 301

[[redirects]]
  from = "/fortuner-2023.html"
  to = "/fortuner-2023"
  status = 301

[[redirects]]
  from = "/hilux.html"
  to = "/hilux"
  status = 301

[[redirects]]
  from = "/mazda-cx30.html"
  to = "/mazda-cx30"
  status = 301

[[redirects]]
  from = "/kia-seltos.html"
  to = "/kia-seltos"
  status = 301

[[redirects]]
  from = "/kia-picanto.html"
  to = "/kia-picanto"
  status = 301

[[redirects]]
  from = "/nosotros.html"
  to = "/nosotros"
  status = 301
