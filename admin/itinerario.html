<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Itinerario — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .cal-nav { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
    .cal-nav button { background:var(--azul); color:white; border:none; width:36px; height:36px; border-radius:8px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
    .cal-nav button:hover { background:var(--azul-mid); }
    .cal-nav h3 { font-size:18px; color:var(--azul); text-transform:capitalize; min-width:200px; text-align:center; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; background:var(--gris); border-radius:10px; overflow:hidden; }
    .cal-header { background:var(--azul); color:white; padding:8px 4px; text-align:center; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .cal-day { background:white; min-height:80px; padding:6px; position:relative; }
    .cal-day.other-month { background:var(--gris-f); color:#ccc; }
    .cal-day.today { box-shadow:inset 0 0 0 2px var(--azul-claro); }
    .cal-day-num { font-size:12px; font-weight:700; color:var(--texto-mid); margin-bottom:4px; }
    .cal-day.today .cal-day-num { color:var(--azul); }
    .cal-day.other-month .cal-day-num { color:#ccc; }
    .cal-event { font-size:9px; padding:2px 5px; border-radius:4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; cursor:default; }
    .cal-event.occupied { background:#fde8e8; color:var(--rojo); border-left:3px solid var(--rojo); }
    .cal-event.start { background:#e8f0fd; color:var(--azul); border-left:3px solid var(--azul); }
    .cal-event.end { background:#fff8e1; color:var(--oro-oscuro); border-left:3px solid var(--oro); }
    .legend { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--texto-mid); }
    .legend-dot { width:12px; height:12px; border-radius:3px; }
    @media(max-width:768px) { .cal-day{min-height:50px;padding:3px} .cal-day-num{font-size:10px} .cal-event{font-size:8px;padding:1px 3px} }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="brand">RENTACAR DEL EJE<span>Panel Administrativo</span></div>
    <nav class="admin-nav">
      <a href="/admin/">Inicio</a>
      <a href="/admin/itinerario.html">Itinerario</a>
      <a href="/admin/reservas.html">Reservas</a>
      <a href="/admin/vehiculos.html">Vehiculos</a>
      <a href="/admin/ganancias.html">Ganancias</a>
    </nav>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </header>

  <main class="admin-main">
    <div class="card">
      <div class="card-header">Itinerario de Vehiculos</div>
      <div class="card-body">
        <div class="filters">
          <div class="field">
            <label>Vehiculo</label>
            <select id="filtroVehiculo" onchange="renderCalendar()">
              <option value="">Todos los vehiculos</option>
            </select>
          </div>
        </div>
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">&lt;</button>
          <h3 id="calTitle"></h3>
          <button onclick="changeMonth(1)">&gt;</button>
          <button onclick="goToday()" style="width:auto;padding:0 14px;font-size:11px;font-weight:700">Hoy</button>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#e8f0fd;border-left:3px solid var(--azul)"></div> Inicio de reserva</div>
          <div class="legend-item"><div class="legend-dot" style="background:#fde8e8;border-left:3px solid var(--rojo)"></div> Ocupado</div>
          <div class="legend-item"><div class="legend-dot" style="background:#fff8e1;border-left:3px solid var(--oro)"></div> Fin de reserva</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Reservas del Mes</div>
      <div class="card-body">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>N° Reserva</th><th>Cliente</th><th>Vehiculo</th><th>Inicio</th><th>Fin</th><th>Dias</th><th>Estado</th></tr></thead>
            <tbody id="tbodyMes"><tr><td colspan="7" class="loading">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/admin/js/admin.js?v=3"></script>
  <script>
    let vehiculos = [], reservas = [];
    let currentYear, currentMonth;

    async function init() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      const [vRes, rRes] = await Promise.all([
        sb.from('vehiculos').select('*').eq('activo', true).order('descripcion'),
        sb.from('reservas').select('*').in('estado', ['activa', 'completada'])
      ]);
      vehiculos = vRes.data || [];
      reservas = rRes.data || [];
      const select = document.getElementById('filtroVehiculo');
      vehiculos.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.placa + ' — ' + v.descripcion;
        select.appendChild(opt);
      });
      renderCalendar();
    }

    function changeMonth(d) { currentMonth+=d; if(currentMonth<0){currentMonth=11;currentYear--} if(currentMonth>11){currentMonth=0;currentYear++} renderCalendar(); }
    function goToday() { const n=new Date(); currentYear=n.getFullYear(); currentMonth=n.getMonth(); renderCalendar(); }

    function renderCalendar() {
      const vid = document.getElementById('filtroVehiculo').value;
      const filtered = vid ? reservas.filter(r=>r.vehiculo_id===parseInt(vid)) : reservas;
      document.getElementById('calTitle').textContent = new Date(currentYear, currentMonth).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth+1, 0);
      const startDay = firstDay.getDay();
      const today = new Date(); today.setHours(0,0,0,0);
      const vMap = {}; vehiculos.forEach(v=>vMap[v.id]=v);

      let html = '';
      ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'].forEach(d => html+=`<div class="cal-header">${d}</div>`);
      const startDate = new Date(firstDay); startDate.setDate(startDate.getDate()-startDay);
      const totalCells = Math.ceil((lastDay.getDate()+startDay)/7)*7;

      for (let i=0; i<totalCells; i++) {
        const cellDate = new Date(startDate); cellDate.setDate(startDate.getDate()+i); cellDate.setHours(0,0,0,0);
        const dateStr = cellDate.toISOString().slice(0,10);
        const isCurrentMonth = cellDate.getMonth()===currentMonth;
        const isToday = cellDate.getTime()===today.getTime();
        let cls = 'cal-day'; if(!isCurrentMonth)cls+=' other-month'; if(isToday)cls+=' today';
        let events = '';
        if (isCurrentMonth) {
          filtered.forEach(r => {
            if (dateStr>=r.fecha_inicio && dateStr<=r.fecha_fin) {
              const v=vMap[r.vehiculo_id]; const placa=v?v.placa:'';
              if(dateStr===r.fecha_inicio) events+=`<div class="cal-event start" title="${r.nombre_cliente} — ${placa}">${placa} ${r.nombre_cliente}</div>`;
              else if(dateStr===r.fecha_fin) events+=`<div class="cal-event end" title="Devolucion: ${r.nombre_cliente}">${placa} Dev.</div>`;
              else events+=`<div class="cal-event occupied" title="${r.nombre_cliente} — ${placa}">${placa}</div>`;
            }
          });
        }
        html+=`<div class="${cls}"><div class="cal-day-num">${cellDate.getDate()}</div>${events}</div>`;
      }
      document.getElementById('calendar').innerHTML = html;

      const mesRes = filtered.filter(r => r.fecha_inicio<=lastDay.toISOString().slice(0,10) && r.fecha_fin>=firstDay.toISOString().slice(0,10));
      const tbody = document.getElementById('tbodyMes');
      if (!mesRes.length) { tbody.innerHTML='<tr><td colspan="7" class="empty-state">No hay reservas este mes</td></tr>'; return; }
      const badgeMap = {activa:'badge-green',completada:'badge-blue'};
      tbody.innerHTML = mesRes.map(r => {
        const v=vMap[r.vehiculo_id];
        return `<tr><td><strong>${r.numero_reserva}</strong></td><td>${r.nombre_cliente}</td><td>${v?v.placa+' — '+v.descripcion:'N/A'}</td><td>${fmtDate(r.fecha_inicio)}</td><td>${fmtDate(r.fecha_fin)}</td><td>${r.dias||'—'}</td><td><span class="badge ${badgeMap[r.estado]||'badge-gray'}">${r.estado}</span></td></tr>`;
      }).join('');
    }

    init();
  </script>
</body>
</html>
