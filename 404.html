<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Renta Car del Eje</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #c9a84c;
      --gold-light: #e2c36b;
      --bg-primary: #0a0a0a;
      --bg-secondary: #0e0e0e;
      --white: #ffffff;
      --gray-200: #d4d0c8;
      --gray-300: #9a958b;
      --gray-500: #3d3a34;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--gray-200);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 6px;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .logo-sub {
      font-size: 0.6rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gold);
      border-top: 1px solid var(--gold);
      padding-top: 3px;
      display: block;
      margin-bottom: 48px;
    }
    .code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      color: var(--gray-300);
      margin-bottom: 32px;
      max-width: 400px;
    }
    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #a07c2a);
      color: var(--bg-primary);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 76, 0.35);
    }
    .btn-secondary {
      border: 1px solid var(--gray-500);
      color: var(--gray-200);
      background: transparent;
    }
    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
  </style>
</head>
<body>
  <a href="/" class="logo">RENTA CAR<span class="logo-sub">D E L &nbsp; E J E</span></a>
  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>La página que buscas no existe o fue movida. Explora nuestra flota o contáctanos por WhatsApp.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Ver Flota</a>
    <a href="https://wa.me/573147582415?text=Hola%2C%20necesito%20ayuda" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  </div>
</body>
</html>
